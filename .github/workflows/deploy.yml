name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
          login-server: rajeshregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t rajeshregistry.azurecr.io/rajesh-it-solutions:${{ github.sha }} -t rajeshregistry.azurecr.io/rajesh-it-solutions:latest -f Dockerfile .
          docker push rajeshregistry.azurecr.io/rajesh-it-solutions:${{ github.sha }}
          docker push rajeshregistry.azurecr.io/rajesh-it-solutions:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: rajesh-it-solutions-app
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'rajeshregistry.azurecr.io/rajesh-it-solutions:latest'
