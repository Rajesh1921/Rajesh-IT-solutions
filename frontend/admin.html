<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajesh IT Solutions | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: rgba(20, 20, 25, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --primary: #0070f3;
            --primary-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 198, 255, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 114, 255, 0.05) 0%, transparent 40%);
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Container */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
            flex: 1;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }

        .logo-cloud {
            font-size: 28px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo-text p {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #fff;
        }

        /* Auth Screen */
        .auth-screen {
            position: fixed;
            inset: 0;
            background: #060608;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            text-align: center;
        }

        .auth-icon {
            font-size: 40px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }

        .auth-card h2 {
            font-family: 'Outfit', sans-serif;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .auth-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0070f3;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 15px rgba(0, 112, 243, 0.15);
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 16px;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(0, 114, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Dashboard Content */
        .dashboard-content {
            display: none;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(0, 112, 243, 0.1);
            color: #00c6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-info h3 {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-info p {
            font-size: 28px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
        }

        /* Message Table / Cards */
        .messages-section {
            padding: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .section-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
        }

        .refresh-btn {
            font-size: 14px;
            padding: 8px 16px;
        }

        /* Message Card styling */
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-card {
            padding: 20px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.01);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .message-card:hover {
            border-color: rgba(0, 114, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }

        .message-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
        }

        .user-details h4 {
            font-size: 16px;
            font-weight: 600;
        }

        .user-details a {
            color: #00c6ff;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .user-details a:hover {
            text-decoration: underline;
        }

        .message-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .message-body {
            font-size: 14px;
            line-height: 1.6;
            color: #e2e8f0;
            background: rgba(0, 0, 0, 0.2);
            padding: 14px;
            border-radius: 8px;
            border-left: 2px solid var(--primary);
        }

        .card-actions {
            align-self: flex-end;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: var(--error);
            color: #fff;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.1);
        }

        /* Toast Alert */
        .alert {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .alert.show {
            transform: translateY(0);
            opacity: 1;
        }

        .alert.success { background: var(--success); }
        .alert.error { background: var(--error); }
    </style>
</head>
<body>

    <!-- Auth screen -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-card glass">
            <div class="auth-icon"><i class="fa-solid fa-user-lock"></i></div>
            <h2>Admin Portal</h2>
            <p>Enter your passcode to view contact messages.</p>
            <form id="authForm">
                <div class="input-group">
                    <label>Passcode</label>
                    <input type="password" id="passcodeInput" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Unlock Dashboard</button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <div id="dashboardContent" class="dashboard-content">
        <div class="container">
            <header>
                <a href="/" class="logo">
                    <i class="fa-solid fa-cloud-bolt logo-cloud"></i>
                    <div class="logo-text">
                        <h1>RAJESH</h1>
                        <p>IT SOLUTIONS</p>
                    </div>
                </a>
                <button id="logoutBtn" class="btn btn-outline"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
            </header>

            <div class="stats-row">
                <div class="stat-card glass">
                    <div class="stat-icon"><i class="fa-solid fa-envelope"></i></div>
                    <div class="stat-info">
                        <h3>Total Submissions</h3>
                        <p id="totalCount">0</p>
                    </div>
                </div>
                <div class="stat-card glass">
                    <div class="stat-icon" style="color: var(--success); background: rgba(16, 185, 129, 0.1);"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="stat-info">
                        <h3>Server Status</h3>
                        <p style="font-size: 16px; margin-top: 6px; font-weight: 600;">ACTIVE</p>
                    </div>
                </div>
            </div>

            <div class="messages-section glass">
                <div class="section-header">
                    <h2>Inquiries & Messages</h2>
                    <button id="refreshBtn" class="btn btn-outline refresh-btn"><i class="fa-solid fa-rotate"></i> Refresh</button>
                </div>

                <div id="messagesContainer">
                    <!-- Loaded dynamically -->
                    <div class="empty-state">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <p>Loading messages...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inline Alert -->
    <div id="alertBox" class="alert"></div>

    <script>
        const authScreen = document.getElementById('authScreen');
        const dashboardContent = document.getElementById('dashboardContent');
        const authForm = document.getElementById('authForm');
        const passcodeInput = document.getElementById('passcodeInput');
        const logoutBtn = document.getElementById('logoutBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const totalCountEl = document.getElementById('totalCount');
        const alertBox = document.getElementById('alertBox');

        let passcode = sessionStorage.getItem('admin_passcode') || '';

        // Initial Auth check
        if (passcode) {
            loadDashboard();
        }

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            passcode = passcodeInput.value.trim();
            loadDashboard();
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('admin_passcode');
            passcode = '';
            authScreen.style.display = 'flex';
            dashboardContent.style.display = 'none';
            passcodeInput.value = '';
        });

        refreshBtn.addEventListener('click', () => {
            fetchMessages();
        });

        function loadDashboard() {
            authScreen.style.display = 'none';
            dashboardContent.style.display = 'block';
            fetchMessages();
        }

        async function fetchMessages() {
            messagesContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Fetching latest submissions...</p>
                </div>
            `;

            try {
                const response = await fetch(`/api/contacts?passcode=${encodeURIComponent(passcode)}`, {
                    headers: {
                        'x-admin-passcode': passcode
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Invalid passcode. Access Denied.');
                    }
                    throw new Error('Failed to fetch data from server.');
                }

                const data = await response.json();
                sessionStorage.setItem('admin_passcode', passcode); // Save valid passcode
                renderMessages(data);
            } catch (err) {
                showAlert(err.message, 'error');
                // Kick back to login screen if unauthorized
                sessionStorage.removeItem('admin_passcode');
                authScreen.style.display = 'flex';
                dashboardContent.style.display = 'none';
            }
        }

        function renderMessages(messages) {
            totalCountEl.textContent = messages.length;

            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-folder-open"></i>
                        <p>No messages received yet.</p>
                    </div>
                `;
                return;
            }

            messagesContainer.innerHTML = '';
            
            const list = document.createElement('div');
            list.className = 'message-list';

            messages.forEach(msg => {
                const card = document.createElement('div');
                card.className = 'message-card';
                
                const date = new Date(msg.createdAt).toLocaleString();
                
                card.innerHTML = `
                    <div class="message-meta">
                        <div class="user-details">
                            <h4>${escapeHTML(msg.name)}</h4>
                            <a href="mailto:${encodeURIComponent(msg.email)}"><i class="fa-regular fa-envelope"></i> ${escapeHTML(msg.email)}</a>
                        </div>
                        <div class="message-date">${date}</div>
                    </div>
                    <div class="message-body">${escapeHTML(msg.message)}</div>
                    <div class="card-actions">
                        <button class="btn-delete" onclick="deleteMessage('${msg._id}')"><i class="fa-regular fa-trash-can"></i> Delete</button>
                    </div>
                `;
                list.appendChild(card);
            });
            messagesContainer.appendChild(list);
        }

        async function deleteMessage(id) {
            if (!confirm('Are you sure you want to delete this message?')) return;

            try {
                const response = await fetch(`/api/contacts/${id}?passcode=${encodeURIComponent(passcode)}`, {
                    method: 'DELETE',
                    headers: {
                        'x-admin-passcode': passcode
                    }
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert(result.message || 'Message deleted successfully', 'success');
                    fetchMessages();
                } else {
                    throw new Error(result.error || 'Failed to delete message');
                }
            } catch (err) {
                showAlert(err.message, 'error');
            }
        }

        function showAlert(message, type) {
            alertBox.className = `alert ${type}`;
            alertBox.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            alertBox.classList.add('show');
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 3000);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>
